name: run-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        exclude:
          # Dev tooling only: Laravel 12 needs Pest 4 / PHPUnit 12, whose paratest
          # releases cap PHP at 8.5. The package itself installs fine on this combo.
          - php: '8.6'
            laravel: '12.*'
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Lowest versions allowed by composer.json, to catch constraints that are too loose.
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-lowest
          # The single job that reports coverage.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
            coverage: true

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}${{ matrix.coverage && ' - coverage' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest --parallel

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/pest --parallel --coverage --min=100 --coverage-clover coverage.xml

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis & code style

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Check code style
        run: vendor/bin/pint --test
